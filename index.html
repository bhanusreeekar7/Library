<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BookShelf</h1>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for books...">
            <button>Search</button>
        </div>
    </header>

    <div class="layout">
        <aside>
            <h2>My Library</h2>
            <nav>
                <nav>
                    <button id="all-books-btn">All Books</button>
                    <button id="favorites-btn">Favorites</button>
                    <button id="want-to-read-btn">Want to Read</button>
</nav>
            </nav>
        </aside>
        <main>
            <h2 id="section-title">All Books</h2>
             <p id="status"></p>
            <div class="book-grid" id="book-grid"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
